<style>
:root{
  --bg:#F3F5F8;--surface:#FFFFFF;--sunk:#EDF0F4;--line:#D9DEE7;--line2:#E6EAF0;
  --text:#141821;--muted:#586173;--soft:#3A4252;--accent:#8A5A00;--accent-bg:#FFC24B;--on-accent:#1A1203;
  --up:#1B62C0;--dn:#A8480A;--on-up:#FFFFFF;--on-dn:#FFFFFF;--sel:#E6EDF8;--neutral:#D4DAE3;--warn-bg:#FFF4DC;--warn:#6B4600;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116;--surface:#151922;--sunk:#10141B;--line:#232937;--line2:#1E2430;
    --text:#E8EAEE;--muted:#9AA3B2;--soft:#C9CFD9;--accent:#FFC24B;--accent-bg:#FFC24B;--on-accent:#14110A;
    --up:#5AA9FF;--dn:#FF9F43;--on-up:#0B1220;--on-dn:#1A0F05;--sel:#1E2532;--neutral:#2A3140;--warn-bg:#2B2210;--warn:#FFD98A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116;--surface:#151922;--sunk:#10141B;--line:#232937;--line2:#1E2430;
  --text:#E8EAEE;--muted:#9AA3B2;--soft:#C9CFD9;--accent:#FFC24B;--accent-bg:#FFC24B;--on-accent:#14110A;
  --up:#5AA9FF;--dn:#FF9F43;--on-up:#0B1220;--on-dn:#1A0F05;--sel:#1E2532;--neutral:#2A3140;--warn-bg:#2B2210;--warn:#FFD98A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.4}
a{color:var(--soft);text-decoration:none}a:hover{color:var(--text)}

.wrap{max-width:1400px;margin:0 auto;padding:0 24px}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}

nav.main{display:flex;flex-wrap:wrap;gap:4px}

.grid-mkt{display:grid;grid-template-columns:36px minmax(190px,1.8fr) 48px 96px 96px 86px 64px 76px 86px 70px;gap:8px;align-items:center}

.line{display:flex;justify-content:space-between;gap:8px}

.cta:disabled{background:var(--neutral)!important;color:var(--muted)!important;cursor:not-allowed}
.status{margin:0;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.kpi .k{font-size:12px;color:var(--muted)}.kpi .v{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.kpi .d{font-family:'JetBrains Mono',monospace;font-size:13px;margin-top:2px}
table{width:100%;border-collapse:collapse}

td.n,th.n{text-align:right;font-family:'JetBrains Mono',monospace}

tr.you td{background:var(--sel)}
.link{background:none;border:0;padding:0;cursor:pointer;font-weight:600;color:var(--text);text-align:left}

.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:10px;padding:2px 8px;background:var(--accent-bg);color:var(--on-accent);margin-left:6px;vertical-align:1px}
.chip.rej{background:var(--neutral);color:var(--soft)}
.alloc{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--sunk)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--soft);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.empty{padding:28px 20px;color:var(--muted);text-align:center}
.formula{font-family:'JetBrains Mono',monospace;font-size:14px;background:var(--sunk);border-radius:10px;padding:14px 16px;overflow-x:auto;white-space:nowrap}
.prose p{margin:0 0 10px;color:var(--soft);line-height:1.55;max-width:72ch}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.create{display:flex;flex-direction:column;gap:10px}
.create label{font-size:12px;color:var(--soft)}
.create .rowf{display:flex;gap:8px;flex-wrap:wrap}
.create input{flex:1 1 180px}
.create button{height:44px;padding:0 18px;border:0;border-radius:8px;background:var(--accent-bg);color:var(--on-accent);font-weight:700;cursor:pointer}
.create button:disabled{opacity:.6;cursor:not-allowed}
.err{color:var(--dn);font-size:13px;margin:0}
@media (max-width:640px){.wrap{padding:0 16px}.tape .wrap{padding:10px 16px}.me{margin-left:0;width:100%}.bigprice{font-size:30px}}
@media (prefers-reduced-motion:no-preference){.flash{animation:fl 1.2s ease-out}@keyframes fl{from{background:var(--sel)}to{background:transparent}}}
</style>

<body>
<header class="top">
  <div class="wrap topbar">
    <a href="#market" class="brand" aria-label="FieldX home">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" fill="none" stroke="var(--accent-bg)" stroke-width="2"/><path d="M7 19 L12 13 L16 16 L21 8" fill="none" stroke="var(--accent-bg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      FieldX <span class="tag">NFL</span>
    </a>
    <nav class="main" aria-label="Main">
      <a href="#market" data-nav="market">Market</a>
      <a href="#portfolio" data-nav="portfolio">Portfolio</a>
      <a href="#leaderboard" data-nav="leaderboard">Leaderboard</a>
      <a href="#how-it-works" data-nav="how-it-works">How pricing works</a>
    </nav>
    <div class="me" id="me"></div>
  </div>
</header>
<div class="tape" aria-label="Biggest movers"><div class="wrap" id="tape"></div></div>
<div id="banner" class="banner" role="status" hidden></div>
<main class="wrap">
  <section class="view" id="v-market" aria-labelledby="mkt-h"></section>
  <section class="view" id="v-portfolio" aria-labelledby="pf-h"></section>
  <section class="view" id="v-leaderboard" aria-labelledby="lb-h"></section>
  <section class="view" id="v-how-it-works" aria-labelledby="how-h"></section>
</main>
<script>
(function(){
"use strict";
/* ---------- Players and weekly stats are loaded from the database ---------- */
var PLAYERS = [], P = {}, STATS_VERSIONS = [];

/* ---------- Pricing model ---------- */
var F=40, K=10, REPL={QB:15,RB:9,WR:9,TE:6}, ALPHA=1.0, GAMMA=0.25, VREF=3, HALF=24*3600e3, START=5000, SHARES=10, MAXHOLD=3;
function ppgAt(p,t){ var v=p.ppg; STATS_VERSIONS.forEach(function(s){ if(s.from<=t && s.ppg[p.tk]!=null) v=s.ppg[p.tk]; }); return v; }
function pvAt(p,t){ return F+K*Math.max(0,ppgAt(p,t)-REPL[p.pos]); }
function flowAt(ev,t){ var b=0,s=0; ev.forEach(function(e){ if(e.t>t) return; var w=Math.pow(.5,(t-e.t)/HALF); if(e.q>0) b+=e.q*w; else s-=e.q*w; }); return {b:b,s:s}; }
function dAt(ev,t){ var f=flowAt(ev,t), v=f.b+f.s; if(v<=0) return 1; return Math.exp(GAMMA*((f.b-f.s)/v)*Math.min(1,v/VREF)); }
function quote(pv,s,D){ var S=Math.exp(ALPHA*s/SHARES); var mv=Math.min(2.5*pv,Math.max(.5*pv,pv*S*D)); return {price:.5*(pv+mv),mv:mv,S:S}; }
/* ---------- Trading pause: closed from Sunday 9:30 AM ET until the next stats update (or the owner reopens) ---------- */
var GAME_START=Date.UTC(2026,9,30,12,0);
var ETF=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",weekday:"short",hourCycle:"h23"});
function etWall(t){ var o={}; ETF.formatToParts(new Date(t)).forEach(function(x){ o[x.type]=x.value; }); return o; }
function etToUtc(y,mo,d,h,mi){ for(var off=4;off<=5;off++){ var u=Date.UTC(y,mo-1,d,h+off,mi), w=etWall(u); if(+w.year===y&&+w.month===mo&&+w.day===d&&(+w.hour%24)===h&&+w.minute===mi) return u; } return Date.UTC(y,mo-1,d,h+5,mi); }
function sundayOpen(t,dir){ for(var k=0;k<9;k++){ var w=etWall(t+dir*k*864e5); if(w.weekday==="Sun"){ var u=etToUtc(+w.year,+w.month,+w.day,9,30); if(dir<0?u<=t:u>t) return u; } } return null; }
function closedAt(t,reopens){
  var k=sundayOpen(t,-1); if(!k||k<GAME_START) return false;
  if(STATS_VERSIONS.some(function(v){ return v.from>k&&v.from<=t; })) return false;
  if((reopens||[]).some(function(r){ return r>k&&r<=t; })) return false;
  return true;
}
function walk(pv,s,D,side,q){ var t=0,j; if(side==="buy") for(j=0;j<q;j++) t+=quote(pv,s+j,D).price; else for(j=1;j<=q;j++) t+=quote(pv,s-j,D).price; return t; }

/* Rebuilds balances, holdings and price history from the trades the server recorded. */
function replay(traders, now, reopens){
  var mk={}; PLAYERS.forEach(function(p){ mk[p.tk]={s:0,ev:[],hist:[],last:null}; });
  var versions=STATS_VERSIONS.slice().sort(function(a,b){ return a.from-b.from; }), vi=0, snaps=[];
  function snap(v){
    var before={}, after={};
    PLAYERS.forEach(function(p){ var m=mk[p.tk], D=dAt(m.ev,v.from); before[p.tk]=quote(pvAt(p,v.from-1),m.s,D).price; after[p.tk]=quote(pvAt(p,v.from),m.s,D).price; m.hist.push({t:v.from,p:after[p.tk],upd:v.label||"Stats update"}); });
    snaps.push({from:v.from,label:v.label||"Stats update",before:before,after:after});
  }
  var acc={};
  traders.forEach(function(tr){ acc[tr.id]={id:tr.id,handle:tr.handle,created:tr.created,cash:START,hold:{},cost:{},log:[],n:0}; });
  var all=[];
  traders.forEach(function(tr){ tr.trades.forEach(function(x){ all.push({x:x,who:tr.id}); }); });
  all.sort(function(a,b){ return (a.x.t-b.x.t) || (a.x.id-b.x.id); });
  var tape=[];
  all.forEach(function(o){
    var x=o.x, a=acc[o.who], m=mk[x.tk]; if(!a||!m) return;
    while(vi<versions.length && versions[vi].from<=x.t){ snap(versions[vi]); vi++; }
    var h=a.hold[x.tk]||0, c=a.cost[x.tk]||0;
    if(x.side==="buy"){ a.cash-=x.total; a.hold[x.tk]=h+x.q; a.cost[x.tk]=c+x.total; m.s+=x.q; m.ev.push({t:x.t,q:x.q}); }
    else { a.cash+=x.total; a.hold[x.tk]=h-x.q; a.cost[x.tk]=(h>0&&(h-x.q)>0)?c*(h-x.q)/h:0; m.s-=x.q; m.ev.push({t:x.t,q:-x.q}); }
    var rec={id:x.id,t:x.t,tk:x.tk,side:x.side,q:x.q,who:o.who,total:x.total,pB:x.pB,pA:x.pA,mvB:x.mvB,mvA:x.mvA};
    m.hist.push({t:x.t,p:x.pA}); m.last=rec; a.n++; tape.push(rec); a.log.push(rec);
  });
  while(vi<versions.length && versions[vi].from<=now){ snap(versions[vi]); vi++; }
  var lastSnap=snaps.length?snaps[snaps.length-1]:null;
  var live={};
  PLAYERS.forEach(function(p){
    var m=mk[p.tk], pv=pvAt(p,now), D=dAt(m.ev,now), q=quote(pv,m.s,D), vol=0, holders=0;
    m.ev.forEach(function(e){ if(now-e.t<HALF) vol+=Math.abs(e.q); });
    Object.keys(acc).forEach(function(id){ if((acc[id].hold[p.tk]||0)>0) holders++; });
    live[p.tk]={tk:p.tk,p:p,pv:pv,D:D,S:q.S,mv:q.mv,price:q.price,s:m.s,vol:vol,holders:holders,chg:(q.price/pv-1)*100,hist:m.hist,last:m.last,ev:m.ev,
      basePrice:pvAt(p,-Infinity), ppg:ppgAt(p,now), beforeUpd:lastSnap?lastSnap.before[p.tk]:null,
      sinceUpd:lastSnap?(q.price/lastSnap.before[p.tk]-1)*100:null, updMove:lastSnap?(lastSnap.after[p.tk]/lastSnap.before[p.tk]-1)*100:null};
  });
  Object.keys(acc).forEach(function(id){
    var a=acc[id], hv=0, cb=0;
    Object.keys(a.hold).forEach(function(tk){ if(a.hold[tk]>0){ hv+=a.hold[tk]*live[tk].price; cb+=a.cost[tk]; } });
    a.holdVal=hv; a.costBasis=cb; a.total=a.cash+hv; a.ret=(a.total/START-1)*100;
  });
  return {live:live,acc:acc,tape:tape.reverse(),snaps:snaps,lastSnap:lastSnap};
}

/* ---------- Helpers ---------- */
function fmt(n){ return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function sfmt(n){ return (n>=-0.005?"+":"−")+fmt(Math.abs(n)); }
function pct(c){ return (c>=-0.05?"▲ +":"▼ −")+Math.abs(c).toFixed(1)+"%"; }
function cls(n){ return n>=-0.005?"up":"dn"; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function when(t){ return new Date(t).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }
var PALETTE=["#FFC24B","#7FD1C7","#5AA9FF","#F28BB4","#B794F6","#9BD86A","#FF9F43","#7EC8F2"];
function colorFor(id){ var h=0; for(var i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))>>>0; return PALETTE[h%PALETTE.length]; }
function initials(h){ var w=h.trim().split(/\s+/); return ((w[0]||"?")[0]+(w[1]?w[1][0]:(w[0][1]||""))).toUpperCase(); }
function avatar(id,handle,size){ return '<span class="avatar" aria-hidden="true" style="width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*.38)+'px;background:'+colorFor(id)+'">'+esc(initials(handle))+'</span>'; }

/* ---------- App state ---------- */
var st={ view:"market", sel:"JSN", pos:"ALL", q:"", reopens:[], closed:false, isOwner:false, side:"buy", qty:1, msg:"", msgOk:true, pending:false,
  me:null, email:"", traders:[], loaded:false, offline:false, canTrade:null, handle:"", createErr:"",
  authMode:"in", authEmail:"", authErr:"", authInfo:"", authBusy:false, noConfig:false };
var R=replay([],Date.now(),[]);

function recompute(){ var n=Date.now(); R=replay(st.traders,n,st.reopens); st.closed=closedAt(n,st.reopens); }
function myAcc(){ return st.me && R.acc[st.me] ? R.acc[st.me] : null; }

/* ---------- Rendering ---------- */
function renderMe(){
  var a=myAcc(), el=document.getElementById("me");
  var out='<button type="button" class="link" data-act="signout" style="font-size:13px;color:var(--muted);font-weight:500">Sign out</button>';
  if(!st.me){ el.innerHTML=''; return; }
  if(!a){ el.innerHTML=(st.loaded?'<a href="#portfolio" style="color:var(--accent);font-weight:600;font-size:13px">Create your trader account</a>':'')+out; return; }
  el.innerHTML='<div class="stat"><div class="k">Holdings</div><div class="v">'+fmt(a.holdVal)+'</div></div>'+

function chart(l){

  var vals=pts.map(function(x){ return x.p; }), mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), sp=(mx-mn)||Math.max(1,mx*.02);
  if(mx-mn===0){ mn-=sp/2; }
  var xy=vals.map(function(v,i){ return (i/(vals.length-1)*360).toFixed(1)+","+(12+(1-(v-mn)/sp)*116).toFixed(1); }).join(" ");
  var col=vals[vals.length-1]>=vals[0]?"var(--up)":"var(--dn)";
  var marks=pts.map(function(x,i){ return x.upd?'<line x1="'+(i/(vals.length-1)*360).toFixed(1)+'" y1="0" x2="'+(i/(vals.length-1)*360).toFixed(1)+'" y2="140" stroke="var(--accent-bg)" stroke-width="1.5" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>':''; }).join("");
  var nTrades=l.hist.filter(function(x){ return !x.upd; }).length, nUpd=l.hist.length-nTrades;
  return '<svg viewBox="0 0 360 140" preserveAspectRatio="none" width="100%" height="140" role="img" aria-label="'+esc(l.p.name)+' price after each trade" style="display:block">'+
    '<line x1="0" y1="35" x2="360" y2="35" stroke="var(--line)"/><line x1="0" y1="70" x2="360" y2="70" stroke="var(--line)"/><line x1="0" y1="105" x2="360" y2="105" stroke="var(--line)"/>'+
    '<polygon points="'+xy+' 360,140 0,140" fill="'+col+'" fill-opacity=".12"/>'+marks+
    '<polyline points="'+xy+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>'+
    '<p class="muted" style="margin:8px 0 0;font-size:12px">'+(l.hist.length?('Price after each trade ('+nTrades+') and stats update ('+nUpd+'), from the opening list price.'+(nUpd?' Dashed lines mark stats updates.':'')):'No trades yet — trading at list price')+'</p>';

function ticketCalc(l,a){
  var isBuy=st.side==="buy", owned=a.hold[l.tk]||0, max=0;

  var q=st.qty, ok=q>0&&q<=max&&!st.pending&&st.canTrade!==false&&!st.closed, total=(q>0&&q<=max)?walk(l.pv,l.s,l.D,st.side,q):0;

  var after=(q>0&&q<=max)?quote(l.pv,l.s+(isBuy?q:-q),dAt(ev,Date.now())).price:l.price;
  return {max:max,ok:ok,total:total,after:after,owned:owned,q:q};

    '<section class="card" aria-labelledby="ps-h"><div class="pad" style="padding-bottom:8px"><h2 id="ps-h">Positions</h2><p class="sub" style="font-size:13px">Entry price is your average cost per share. “Since update” is how much each position’s value has changed since the last stats update.</p></div>'+
      (pos.length?'<div class="scroll"><table><thead><tr><th>Player</th><th class="n">Shares</th><th class="n">Entry price</th><th class="n">Current price</th><th class="n">Cost</th><th class="n">Value</th><th class="n">Gain</th><th class="n">Gain %</th><th class="n">Since update</th><th class="n">Weight</th></tr></thead><tbody>'+
        pos.map(function(p){ return '<tr><td><button type="button" class="link" data-act="open" data-v="'+p.l.tk+'">'+esc(p.l.p.name)+'</button> <span class="mono muted" style="font-size:11px">'+p.l.tk+'</span></td><td class="n">'+p.q+'</td><td class="n">'+fmt(p.c/p.q)+'</td><td class="n">'+fmt(p.l.price)+'</td><td class="n">'+fmt(p.c)+'</td><td class="n">'+fmt(p.v)+'</td><td class="n '+cls(p.g)+'">'+sfmt(p.g)+'</td><td class="n '+cls(p.g)+'">'+pct(p.gp)+'</td>'+(p.l.beforeUpd==null?'<td class="n muted">—</td>':'<td class="n '+cls(p.l.price-p.l.beforeUpd)+'">'+sfmt(p.q*(p.l.price-p.l.beforeUpd))+'</td>')+'<td class="n">'+(p.v/a.total*100).toFixed(1)+'%</td></tr>'; }).join("")+
      '</tbody></table></div>':'<div class="empty">No positions yet. <a href="#market" style="color:var(--accent);font-weight:600">Go to the market</a> to buy your first shares.</div>')+'</section>'+
    '<section class="card" aria-labelledby="th-h"><div class="pad" style="padding-bottom:8px"><h2 id="th-h">Trade history</h2></div>'+
      (a.log.length?'<div class="scroll"><table><thead><tr><th>Time</th><th>Order</th><th>Player</th><th class="n">Total</th><th class="n">Price before</th><th class="n">Price after</th></tr></thead><tbody>'+
        a.log.slice().reverse().map(function(x){ var p=P[x.tk]; return '<tr><td class="muted">'+when(x.t)+'</td><td>'+(x.side==="buy"?"Buy ":"Sell ")+x.q+(x.rejected?'<span class="chip rej" title="'+esc(x.rejected)+'">Not filled</span>':'')+'</td><td>'+esc(p?p.name:x.tk)+'</td>'+
          (x.rejected?'<td class="n muted" colspan="3" style="text-align:right;font-family:inherit">'+esc(x.rejected)+'</td>':'<td class="n">'+fmt(x.total)+'</td><td class="n">'+fmt(x.pB)+'</td><td class="n">'+fmt(x.pA)+'</td>')+'</tr>'; }).join("")+
      '</tbody></table></div>':'<div class="empty">Your trades will appear here.</div>')+'</section>'+
  '</div>';
}
function renderLeaderboard(){
  var el=document.getElementById("v-leaderboard");
  var ranked=Object.keys(R.acc).map(function(id){ return R.acc[id]; }).sort(function(x,y){ return y.total-x.total; });
  var popular=PLAYERS.map(function(p){ return R.live[p.tk]; }).filter(function(l){ return l.s>0; }).sort(function(x,y){ return y.s-x.s; }).slice(0,10);
  el.innerHTML='<div style="display:flex;flex-direction:column;gap:24px">'+
    '<div><h1 id="lb-h">Leaderboard</h1><p class="sub">Ranked by total value: cash plus holdings at current prices. Everyone starts with '+fmt(START)+'.</p></div>'+
    '<section class="card" aria-label="Trader rankings">'+(ranked.length?'<div class="scroll"><table><thead><tr><th class="n" style="width:48px">#</th><th>Trader</th><th class="n">Total value</th><th class="n">Return</th><th class="n">Cash</th><th class="n">Holdings</th><th>Top holding</th><th class="n">Trades</th></tr></thead><tbody>'+
      ranked.map(function(a,i){ var top=Object.keys(a.hold).filter(function(tk){ return a.hold[tk]>0; }).sort(function(x,y){ return a.hold[y]*R.live[y].price-a.hold[x]*R.live[x].price; })[0];
        return '<tr'+(a.id===st.me?' class="you"':'')+'><td class="n">'+(i+1)+'</td><td><span style="display:inline-flex;align-items:center;gap:10px;font-weight:600">'+avatar(a.id,a.handle,28)+esc(a.handle)+(a.id===st.me?'<span class="chip">You</span>':'')+'</span></td>'+
          '<td class="n" style="font-weight:600">'+fmt(a.total)+'</td><td class="n '+cls(a.ret)+'">'+pct(a.ret)+'</td><td class="n">'+fmt(a.cash)+'</td><td class="n">'+fmt(a.holdVal)+'</td>'+
          '<td>'+(top?esc(R.live[top].p.name)+' <span class="mono muted" style="font-size:11px">×'+a.hold[top]+'</span>':'<span class="muted">—</span>')+'</td><td class="n">'+a.n+'</td></tr>'; }).join("")+
      '</tbody></table></div>':'<div class="empty">No traders yet. Be the first: <a href="#portfolio" style="color:var(--accent);font-weight:600">create your account</a>.</div>')+'</section>'+
    '<section class="card" aria-labelledby="mo-h"><div class="pad" style="padding-bottom:8px"><h2 id="mo-h">Most owned players</h2></div>'+
      (popular.length?'<div class="scroll"><table><thead><tr><th>Player</th><th class="n">Shares owned</th><th class="n">Holders</th><th class="n">Price</th><th class="n">vs. list</th></tr></thead><tbody>'+
        popular.map(function(l){ return '<tr><td><button type="button" class="link" data-act="open" data-v="'+l.tk+'">'+esc(l.p.name)+'</button> <span class="mono muted" style="font-size:11px">'+l.tk+'</span></td><td class="n">'+l.s+' / '+SHARES+'</td><td class="n">'+l.holders+'</td><td class="n">'+fmt(l.price)+'</td><td class="n '+cls(l.chg)+'">'+pct(l.chg)+'</td></tr>'; }).join("")+
      '</tbody></table></div>':'<div class="empty">Nobody owns any shares yet.</div>')+'</section>'+
    '<section class="card" aria-labelledby="rt-h"><div class="pad" style="padding-bottom:8px"><h2 id="rt-h">Recent trades</h2></div>'+
      (R.tape.length?'<div class="scroll"><table><thead><tr><th>Time</th><th>Trader</th><th>Order</th><th class="n">Total</th><th class="n">Market value</th><th class="n">Price move</th></tr></thead><tbody>'+
        R.tape.slice(0,15).map(function(x){ var a=R.acc[x.who]; return '<tr><td class="muted">'+when(x.t)+'</td><td>'+esc(a?a.handle:"Someone")+'</td><td>'+(x.side==="buy"?"Bought ":"Sold ")+x.q+' '+x.tk+'</td><td class="n">'+fmt(x.total)+'</td><td class="n">'+fmt(x.mvB)+' → '+fmt(x.mvA)+'</td><td class="n '+cls(x.pA-x.pB)+'">'+pct((x.pA/x.pB-1)*100)+'</td></tr>'; }).join("")+
      '</tbody></table></div>':'<div class="empty">No trades yet.</div>')+'</section>'+
  '</div>';
}
function renderHow(){
  document.getElementById("v-how-it-works").innerHTML='<div style="display:flex;flex-direction:column;gap:24px;max-width:1000px">'+
    '<div><h1 id="how-h">How pricing works</h1><p class="sub">Every player has exactly 10 shares. Each price is half performance, half market.</p></div>'+
    '<div class="formula">Price = 0.5 × Performance value + 0.5 × Market value</div>'+
    '<div class="cols">'+
      '<section class="card pad prose"><h2 style="margin-bottom:10px">Performance value</h2><div class="formula" style="margin-bottom:12px;font-size:13px">PV = $40 + $10 × (PPG − replacement)</div><p>PPG is the player’s PPR fantasy points per game this season. Replacement level is QB 15, RB 9, WR 9, TE 6, so positions compete fairly. $40 is the floor.</p><p>With no trading, a player’s price equals his PV. That’s his list price.</p></section>'+
      '<section class="card pad prose"><h2 style="margin-bottom:10px">Market value</h2><div class="formula" style="margin-bottom:12px;font-size:13px">MV = PV × scarcity × demand</div><p><b>Scarcity</b> = e^(shares owned ÷ 10). Each share traders hold raises market value about 10.5%, so a sold-out player’s market value would be about 2.7× PV, capped at 2.5×.</p><p><b>Demand</b> tracks buy vs. sell pressure with a 24-hour half-life. It reaches full strength at about 3 shares of recent volume and moves MV by up to about ±28%.</p><p>MV stays between 0.5× and 2.5× PV.</p></section>'+
    '</div>'+
    '<section class="card pad prose"><h2 style="margin-bottom:10px">Rules</h2>'+
      '<p>Everyone starts with '+fmt(START)+' in cash. Buy from the shares still available, up to '+MAXHOLD+' shares of any one player, and sell back at any time. There are no fees.</p>'+
      '<p>Orders are priced one share at a time along the curve, so large orders pay more per share. Every price and balance is recalculated from the full trade history, in time order. If two people grab the last shares at once, the later order doesn’t fill and shows as “Not filled” in that trader’s history.</p>'+
      '<p>Stats are updated each week after Monday night’s game. When stats are updated, trades already made keep the prices they had, so entry prices never change. Only current prices and values move.</p></section>'+
    '<section class="card pad prose"><h2 style="margin-bottom:10px">Trading hours</h2><p>The market closes every Sunday at 9:30 AM ET, before the first game including international ones, and stays closed until that week’s stats update is published, usually after Monday night’s game. That way nobody can trade on results before prices reflect them.</p><p>Orders placed while the market is closed don’t fill.</p></section>'+
  '</div>';
}
function render(){
  var ae=document.activeElement, aid=ae&&ae.id, ss=null, se=null;
  try{ if(ae&&ae.selectionStart!=null){ ss=ae.selectionStart; se=ae.selectionEnd; } }catch(e){}
  renderMe(); renderBanner();
  var gate=st.noConfig?'<div class="empty">Not connected to a database yet.</div>':(!st.me?authView():(!st.loaded?'<div class="empty">Loading the market…</div>':null));
  if(gate){ document.getElementById("tape").innerHTML=""; VIEWS.forEach(function(v){ document.getElementById("v-"+v).innerHTML=(v===st.view?gate:""); }); restoreFocus(aid,ss,se); return; }
  renderTape();
  if(st.view==="market") renderMarket();
  else if(st.view==="portfolio") renderPortfolio();
  else if(st.view==="leaderboard") renderLeaderboard();
  else renderHow();
  restoreFocus(aid,ss,se);
}
function restoreFocus(aid,ss,se){ if(aid){ var n=document.getElementById(aid); if(n){ n.focus(); try{ if(ss!=null) n.setSelectionRange(ss,se); }catch(e){} } } }
function updateQuote(){
  var l=R.live[st.sel], a=myAcc(), q=document.getElementById("quote"); if(!a||!q) return;
  var t=ticketCalc(l,a); q.innerHTML=quoteHTML(l,t); document.getElementById("maxq").textContent=t.max;
}

/* ---------- Routing ---------- */
var VIEWS=["market","portfolio","leaderboard","how-it-works"];
function route(){
  var h=(location.hash||"").replace("#",""); st.view=VIEWS.indexOf(h)>=0?h:"market";
  VIEWS.forEach(function(v){ document.getElementById("v-"+v).classList.toggle("on",v===st.view); });
  document.querySelectorAll("[data-nav]").forEach(function(a){ if(a.getAttribute("data-nav")===st.view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  render();
}
window.addEventListener("hashchange",function(){ route(); window.scrollTo(0,0); });

/* ---------- Server calls ---------- */
var sb=null;
async function fetchAll(table, cols, order){
  var out=[], from=0, size=1000;
  for(;;){ var r=await sb.from(table).select(cols).order(order,{ascending:true}).range(from,from+size-1); if(r.error) throw r.error; out=out.concat(r.data||[]); if(!r.data||r.data.length<size) break; from+=size; }
  return out;
}
var loading=null;
function loadAll(){
  if(loading) return loading;
  var timer=setTimeout(function(){ st.offline=true; render(); },10000);
  loading=Promise.all([
    fetchAll("players","tk,name,pos,team,base_ppg","tk"),
    fetchAll("stats_versions","id,from_ts,label,ppg","id"),
    fetchAll("market_reopens","id,at","id"),
    fetchAll("traders","id,handle,created_at","created_at"),
    fetchAll("trades","id,trader_id,tk,side,qty,ts,total,price_before,price_after,mv_before,mv_after","id")
  ]).then(function(res){
    clearTimeout(timer);
    PLAYERS=res[0].map(function(r){ var w=r.name.split(" "); return {tk:r.tk,name:r.name,pos:r.pos,team:r.team,ppg:Number(r.base_ppg),ini:w[0][0]+(w[1]?w[1][0]:"")}; });
    P={}; PLAYERS.forEach(function(p){ P[p.tk]=p; });
    STATS_VERSIONS=res[1].map(function(v){ return {from:Date.parse(v.from_ts),label:v.label,ppg:v.ppg||{}}; });
    st.reopens=res[2].map(function(x){ return Date.parse(x.at); });
    var byId={};
    st.traders=res[3].map(function(t){ return (byId[t.id]={id:t.id,handle:t.handle,created:Date.parse(t.created_at),trades:[]}); });
    res[4].forEach(function(x){ var t=byId[x.trader_id]; if(t) t.trades.push({id:Number(x.id),t:Date.parse(x.ts),tk:x.tk,side:x.side,q:x.qty,total:+x.total,pB:+x.price_before,pA:+x.price_after,mvB:+x.mv_before,mvA:+x.mv_after}); });
    if(!P[st.sel] && PLAYERS.length) st.sel=PLAYERS[0].tk;
    st.loaded=true; st.offline=false; recompute(); render();
  },function(){ clearTimeout(timer); st.offline=true; render(); }).then(function(){ loading=null; });
  return loading;
}
var refreshTimer=null;
function scheduleRefresh(){ clearTimeout(refreshTimer); refreshTimer=setTimeout(loadAll,400); }
async function createAccount(){
  st.pending=true; st.createErr=""; render();
  var r=await sb.rpc("create_trader",{p_handle:st.handle});
  st.pending=false;
  if(r.error){ st.createErr=r.error.message||"Couldn’t create your account. Try again."; render(); return; }
  await loadAll();
}
async function placeOrder(){
  var a=myAcc(); if(!a) return;
  var l=R.live[st.sel], t=ticketCalc(l,a); if(!t.ok) return;
  var side=st.side, q=t.q;
  st.pending=true; st.msg=""; render();
  var r=await sb.rpc("place_trade",{p_tk:l.tk,p_side:side,p_qty:q});
  st.pending=false;
  if(r.error){ st.msgOk=false; st.msg=r.error.message||"The order didn’t go through. Try again."; }
  else { st.msgOk=true; st.qty=1; st.msg=(side==="buy"?"Bought ":"Sold ")+q+" "+l.tk+" for "+fmt(r.data.total)+". Price "+fmt(r.data.price_before)+" → "+fmt(r.data.price_after)+"."; }
  await loadAll();
}
async function signedIn(session){
  var id=session&&session.user?session.user.id:null;
  if(id===st.me) return;
  st.me=id; st.email=session?session.user.email:""; st.loaded=false; render();
  if(!id) return;
  var adm=await sb.rpc("is_admin"); st.isOwner=!adm.error&&adm.data===true;
  await loadAll();
}

/* ---------- Events ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]"); if(!b) return;
  var act=b.getAttribute("data-act"), v=b.getAttribute("data-v");
  if(act==="sel"){ st.sel=v; st.qty=1; st.msg=""; render(); }
  else if(act==="open"){ st.sel=v; st.qty=1; st.msg=""; location.hash="#market"; }
  else if(act==="pos"){ st.pos=v; render(); }
  else if(act==="side"){ st.side=v; st.qty=1; st.msg=""; render(); }
  else if(act==="inc"){ st.qty=Math.max(0,st.qty)+1; var i=document.getElementById("qty"); if(i) i.value=st.qty; updateQuote(); }
  else if(act==="dec"){ st.qty=Math.max(0,st.qty-1); var j=document.getElementById("qty"); if(j) j.value=st.qty; updateQuote(); }
  else if(act==="place"){ placeOrder(); }
  else if(act==="reopen" && st.isOwner){ sb.rpc("reopen_market").then(function(r){ if(r.error){ st.msgOk=false; st.msg=r.error.message; } loadAll(); }); }
  else if(act==="signout"){ sb.auth.signOut(); }
  else if(act==="authmode"){ st.authMode=st.authMode==="up"?"in":"up"; st.authErr=""; st.authInfo=""; render(); }
});
document.addEventListener("input",function(e){
  if(e.target.id==="qty"){ var v=parseInt(e.target.value,10); st.qty=isNaN(v)?0:Math.max(0,v); updateQuote(); }
  if(e.target.id==="handle"){ st.handle=e.target.value; }
  if(e.target.id==="em"){ st.authEmail=e.target.value; }
  if(e.target.id==="q"){ st.q=e.target.value; render(); }
});
document.addEventListener("submit",async function(e){
  var f=e.target.getAttribute("data-form");
  if(f==="create"){ e.preventDefault(); if(!st.pending) createAccount(); }
  if(f==="auth"){
    e.preventDefault(); if(st.authBusy) return;
    var em=document.getElementById("em").value.trim(), pw=document.getElementById("pw").value;
    st.authEmail=em; st.authErr=""; st.authInfo="";
    if(!em||!pw){ st.authErr="Enter your email and password."; render(); return; }
    if(st.authMode==="up"&&pw.length<8){ st.authErr="Use at least 8 characters for your password."; render(); return; }
    st.authBusy=true; render();
    var r=st.authMode==="up"
      ? await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}})
      : await sb.auth.signInWithPassword({email:em,password:pw});
    st.authBusy=false;
    if(r.error){ st.authErr=r.error.message; render(); return; }
    if(st.authMode==="up"&&!r.data.session){ st.authInfo="Check your email for a confirmation link, then come back and sign in."; st.authMode="in"; render(); }
  }
});

/* ---------- Boot ---------- */
recompute();
route();
setInterval(function(){ var was=st.closed; recompute(); var a=document.activeElement; if(was!==st.closed || !(a&&(a.id==="qty"||a.id==="handle"||a.id==="q"||a.id==="em"||a.id==="pw"))) render(); },60000);
setInterval(function(){ if(st.me) loadAll(); },30000);
(function(){
  var cfg=window.FIELDX_CONFIG||{};
  if(!window.supabase||!cfg.url||!cfg.key||/YOUR-/.test(cfg.url+cfg.key)){ st.noConfig=true; render(); return; }
  sb=window.supabase.createClient(cfg.url,cfg.key);
  sb.auth.onAuthStateChange(function(_evt,session){ setTimeout(function(){ signedIn(session); },0); });
  sb.auth.getSession().then(function(r){ signedIn(r.data.session); });
  var ch=sb.channel("fieldx");
  ["trades","traders","stats_versions","market_reopens"].forEach(function(t){ ch.on("postgres_changes",{event:"*",schema:"public",table:t},scheduleRefresh); });
  ch.subscribe();
})();
})();
</script>
</body>
</html>
